# Render blueprint. The data lives in a hosted Turso database (free plan), so there is no disk:
# Render keeps zero-downtime deploys, and the leader lock in the app makes sure only one running
# copy processes orders while the old and new copies overlap during a deploy.
# The web service must be always on (Starter): a free instance sleeps and would miss the timers.
services:
  - type: web
    name: golden-tray
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_AUTH_TOKEN
        sync: false
      - key: SHOPIFY_DOMAIN
        sync: false
      - key: SHOPIFY_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
